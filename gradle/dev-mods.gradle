// -----------------------------------------------------------------------------
// Dev-runtime modpack
//
// Mods listed here are put on the *runtime* classpath of `./gradlew runClient` /
// `runServer` only. They are never bundled into the Diffusicraft jar and never
// become hard dependencies. Versions come from Modrinth's maven
// (maven.modrinth:<slug>:<version-id-or-number>).
//
// Disable the whole set with -PnoDevMods (handy when a dev mod lags behind a
// Minecraft update), or pick a subset with -PdevMods=slug,slug, for example
// -PdevMods=biomes-o-plenty,glitchcore,terrablender to test the biome mods alone.
// The optional mods below the pack load only when named that way.
// -----------------------------------------------------------------------------

def devMods = [
	// Mirrors the maintainer's test pack (Fabric, MC 26.3). Version ids pin the exact file.
	// slug                      : Modrinth version id   // human-readable version
	'entity-model-features'      : 'vF6qLXsA',  // 3.3.12-fabric-26.3
	'entitytexturefeatures'      : 'OOEycXyN',  // 7.2.6-fabric-26.3
	'badoptimizations'           : 'Sp0ctspw',  // 2.4.1
	'biomes-o-plenty'            : 'MAQI6dsY',  // 26.3.0.0.15 (biome-compat target)
	'glitchcore'                 : 'kfFeDnrp',  // 26.3.0.0.5  (required by BoP)
	'terrablender'               : 'xirJYe1V',  // 26.3.0.0.9  (required by BoP; biome-injection compat target)
	'chat-heads'                 : 'i3gcElvQ',  // 1.3.2
	'cloth-config'               : 'fg2uyxOW',  // 26.3.159+fabric
	'c2me-fabric'                : 'gKKkuSYc',  // 0.4.2-alpha.0.106+26.3 (parallel chunk gen: thread-safety target)
	'continuity'                 : 'Jt2sCWTQ',  // 3.0.1+26.3
	'distanthorizons'            : project.distanthorizons_version,  // 3.3.4-26.3 (LOD target)
	'distant-horizons-seedgen'   : '7hGTqcL4',  // 0.9.1 (SeedGen compat target, ARR: dev runtime only)
	'entityculling'              : 'X1g3VhTx',  // 1.11.3
	'ferrite-core'               : 'd5ddUdiB',  // 9.0.0-fabric
	'iris'                       : project.iris_version,  // 1.11.7+26.3-fabric (shader target)
	'lithium'                    : 'xS0Q8LSi',  // mc26.3-0.26.2-fabric
	'modmenu'                    : 'kyy7dbrZ',  // 21.0.0
	'no-chat-reports'            : '6g96avt2',  // Fabric-26.3-v2.21.0
	'reeses-sodium-options'      : 'GGxJ0JAt',  // mc26.3-2.2.6-beta.1+fabric
	'sodium'                     : 'g6ju16VJ',  // mc26.3-0.9.3-beta.1-fabric
	'sodium-extra'               : 'te2y9qZn',  // mc26.3-0.9.4+fabric
	'placeholder-api'            : 'lXytLqWj',  // 3.2.0+26.3
	'visuality'                  : 'BNe9kpJ7',  // 0.7.15+26.3
]

// Compatibility targets outside the maintainer's pack, loaded only when named in -PdevMods.
def optionalDevMods = [
	'techreborn'                 : 'CHhIdHEn',  // 6.2.0 (tech-mod ores for the geology; embeds RebornCore)
	'sulkan'                     : 'pv37EISz',  // 0.6.0-26.3 (shaders on the Vulkan backend; needs sodium)
	'voxy'                       : 'iIrM8ZKQ',  // 0.2.20-beta (LOD target, ARR: dev runtime only; needs sodium)
	// Biome and terrain mods, for ModdedBiomesGameTest (see docs/COMPATIBILITY.md). BoP, GlitchCore and TerraBlender
	// are in the pack above.
	'terralith'                  : 'aGE3hYAA',  // 2.6.5+26.3 (replaces vanilla's parameter list and surface rule)
	'lithostitched'              : 'pZgI6b2t',  // 2.0.6-fabric-26.3 (Terralith's and Tectonic's library)
	'tectonic'                   : 'tRBGDcCT',  // 3.0.32-fabric-26.3 (terrain mod: blends old chunks, raises the height)
	// Wilder Wild does not start beside C2ME or Lithium in a dev run, where FrozenLib loads CompoundTag from its mixin
	// plugin before their mixins into it apply.
	'wilder-wild'                : 'mVVZgOKN',  // 4.3.3-mc26.3-fabric (biomes, and surface rules through FrozenLib)
	'frozenlib'                  : 'W1wrCkKg',  // 3.0.3-mc26.3-fabric (required by Wilder Wild)
	'terrestria'                 : 'K6mjWjWm',  // 8.2.0-alpha.1 (Biolith biomes and surface builders; embeds Biolith)
	'promenade'                  : 'mxbWA9DX',  // 6.0.2+fabric (Biolith biomes)
	// The other mods of docs/MOD_SURVEY.md with a 26.3 release that work with Diffusicraft, not yet checked in game.
	'climate-rivers'             : '5XH8f4HB',  // 26.3.1 (warm, cold and dry rivers, through Lithostitched)
	'puzzles-lib'                : 'b1UA02v8',  // 26.3.17 (required by Climate Rivers)
	'forge-config-api-port'      : 'JpKvrr9J',  // 26.3.1 (required by Climate Rivers and Puzzles Lib)
	'wwoo'                       : '23VeM3qz',  // 3.0.1 (William Wythers' biomes, CC-BY-NC-ND: dev runtime only)
	'cristel-lib'                : 'rWxmPrGC',  // fabric-26.3-3.1.13 (required by WWOO; needs cloth-config)
	'ecologics'                  : '7t3hinz9',  // 2.7.2-NeoFab (features and mobs in vanilla's biomes)
	'geophilic'                  : '5kFV8CEz',  // 3.7 (features in vanilla's biomes, ARR: dev runtime only)
]

// Shader packs, also named in -PdevMods and put in the client runs' shaderpacks folder as <slug>.zip. Like the mods,
// they never leave the dev runtime.
def devShaderPacks = [
	'bliss-shader'               : 'kC2Y8q1P',  // 2.1.2 (Iris pack with Distant Horizons support, ARR: dev runtime only)
	'complementary-unbound'      : 'B1kyfoUZ',  // r5.9.3 (Iris pack with Distant Horizons support, dev runtime only)
]

if (!project.hasProperty('noDevMods')) {
	def wanted = project.findProperty('devMods')?.toString()?.split(',')?.collect { it.trim() }?.findAll { it }
	def known = devMods + optionalDevMods
	def unknown = (wanted ?: []) - known.keySet() - devShaderPacks.keySet()
	if (unknown) {
		throw new GradleException("Unknown dev mods ${unknown}; pick from ${known.keySet() + devShaderPacks.keySet()}")
	}
	dependencies {
		(wanted ? known.subMap(wanted.findAll { known.containsKey(it) }) : devMods).each { slug, ver ->
			localRuntime "maven.modrinth:${slug}:${ver}"
		}
	}
	def packs = devShaderPacks.subMap((wanted ?: []).findAll { devShaderPacks.containsKey(it) })
	if (packs) {
		def packFiles = configurations.detachedConfiguration(*packs.collect { slug, ver ->
			dependencies.create("maven.modrinth:${slug}:${ver}@zip")
		})
		packFiles.transitive = false
		// Into the run's directory, which Loom makes the task's working directory only once the task runs.
		def runs = [runClient: 'client', runClientGameTest: 'clientGameTest']
		tasks.matching { it.name in runs.keySet() }.configureEach { task ->
			doFirst {
				def shaderpacks = file("${loom.runs.getByName(runs[task.name]).runDir}/shaderpacks")
				packs.each { slug, ver ->
					def file = packFiles.resolvedConfiguration.resolvedArtifacts.find { it.name == slug }.file
					project.copy {
						from file
						into shaderpacks
						rename { "${slug}.zip" }
					}
				}
			}
		}
	}
}
