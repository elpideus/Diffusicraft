// Shader packs, also named in -PdevMods and put in the client runs' shaderpacks folder as <slug>.zip. Like the mods,
// they never leave the dev runtime.
def devShaderPacks = [
	'bliss-shader'               : 'kC2Y8q1P',  // 2.1.2 (Iris pack with Distant Horizons support, ARR: dev runtime only)
	'complementary-unbound'      : 'B1kyfoUZ',  // r5.9.3 (Iris pack with Distant Horizons support, dev runtime only)
]

// The test environments: -PtestEnv=<name> picks a run's mods, and its directory is run-envs/<name>, so that their worlds
// and options stay apart from run/. See docs/DEVELOPMENT.md. Distant Horizons and Voxy stay out of all of them: where
// either is installed, Diffusicraft's own far terrain turns off.
def performanceMods = [
	'sodium', 'sodium-extra', 'reeses-sodium-options', 'lithium', 'ferrite-core', 'entityculling', 'badoptimizations',
	'continuity', 'iris', 'modmenu', 'cloth-config', 'bliss-shader', 'complementary-unbound',
]
def testEnvironments = [
	// Diffusicraft alone, on OpenGL or Vulkan.
	vanilla    : [],
	// The usual client mods and both shader packs, which -Pdiffusicraft.shaderPack turns on.
	performance: performanceMods,
	// A fantasy pack. Wilder Wild is left out: it does not start beside Lithium in a dev run (see above). So are
	// Formations' structures: their 26.3 builds still call Minecraft by its obfuscated names and stop the game at startup.
	modded     : performanceMods + [
		'biomes-o-plenty', 'glitchcore', 'terrablender', 'terralith', 'lithostitched', 'tectonic', 'terrestria',
		'promenade', 'climate-rivers', 'puzzles-lib', 'forge-config-api-port', 'wwoo', 'cristel-lib', 'ecologics',
		'geophilic', 'oh-the-trees-youll-grow', 'dungeons-and-taverns', 'towns-and-towers',
		'repurposed-structures-fabric', 'midnightlib', 'moogs-voyager-structures', 'mss-moogs-soaring-structures',
		'mes-moogs-end-structures', 'mns-moogs-nether-structures', 'moogs-structure-lib', 'structory',
		'structory-towers', 'tidal-towns', 'trek', 'explorations', 'villages-and-pillages', 'adorabuild-structures',
		'ati-structures-vanilla-edition', 'incendium', 'nullscape',
	],
]
def testEnv = project.findProperty('testEnv')?.toString()
if (testEnv && !testEnvironments.containsKey(testEnv)) {
	throw new GradleException("Unknown test environment ${testEnv}; pick from ${testEnvironments.keySet()}")
}

if (!project.hasProperty('noDevMods')) {
	def wanted = testEnv ? testEnvironments[testEnv]
		: project.findProperty('devMods')?.toString()?.split(',')?.collect { it.trim() }?.findAll { it }
	def known = devMods + optionalDevMods
	def unknown = (wanted ?: []) - known.keySet() - devShaderPacks.keySet()
	if (unknown) {
		throw new GradleException("Unknown dev mods ${unknown}; pick from ${known.keySet() + devShaderPacks.keySet()}")
	}
	dependencies {
		(wanted || testEnv ? known.subMap(wanted.findAll { known.containsKey(it) }) : devMods).each { slug, ver ->
			localRuntime "maven.modrinth:${slug}:${ver}"
		}
	}
	def packs = devShaderPacks.subMap((wanted ?: []).findAll { devShaderPacks.containsKey(it) })
	if (packs) {
		def packFiles = configurations.detachedConfiguration(*packs.collect { slug, ver ->
			dependencies.create("maven.modrinth:${slug}:${ver}@zip")
		})
		packFiles.transitive = false
		// Into the run's directory, which Loom makes the task's working directory only once the task runs.
		def runs = [runClient: 'client', runClientGameTest: 'clientGameTest', runBenchmark: 'benchmark']
		tasks.matching { it.name in runs.keySet() }.configureEach { task ->
			doFirst {
				def shaderpacks = file("${loom.runs.getByName(runs[task.name]).runDir}/shaderpacks")
				packs.each { slug, ver ->
					def file = packFiles.resolvedConfiguration.resolvedArtifacts.find { it.name == slug }.file
					project.copy {
						from file
						into shaderpacks
						rename { "${slug}.zip" }
					}
				}
			}
		}
	}
}
