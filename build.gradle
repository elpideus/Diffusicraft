plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Modrinth maven: used for optional compat targets and the dev-runtime modpack (see docs/DEVELOPMENT.md).
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"diffusicraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			ideConfigGenerated true
			vmArgs '-Xmx6G'
		}
		client {
			// Keep model downloads and worlds out of the source tree.
			runDir 'run'
		}
		server {
			runDir 'run-server'
		}
	}
}

// Client game tests (src/gametest): drive the real game through the Diffusicraft screens and save screenshots to
// build/run/clientGameTest/screenshots. Run with `./gradlew runClientGameTest -PnoDevMods` (see docs/DEVELOPMENT.md).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'diffusicraft-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Terrain Diffusion runs through ONNX Runtime. The CPU build is bundled as a jar-in-jar; GPU builds are
	// downloaded at runtime by the resource manager (see docs/RUNTIMES.md and runtime-manifest.json).
	implementation "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
	include "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Optional integration: the config screen button in Mod Menu. Compile-only; Mod Menu is not required.
	clientCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"

	// Dev-runtime mods (client run only). See gradle/dev-mods.gradle.
}

apply from: 'gradle/dev-mods.gradle'

test {
	useJUnitPlatform()
	maxHeapSize = '4G'
	// Tests that need the real ONNX models are tagged "models" and skipped unless -PwithModels is set.
	if (!project.hasProperty('withModels')) {
		useJUnitPlatform { excludeTags 'models' }
	}
	// Forward -Pdiffusicraft.* and -Ponnxruntime.* (e.g. diffusicraft.modelDir, diffusicraft.device) to the tests.
	systemProperties project.properties.findAll { k, v -> k.startsWith('diffusicraft.') || k.startsWith('onnxruntime.') }
	testLogging.showStandardStreams = project.hasProperty('withModels')
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

processResources {
	def props = [
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
	filesMatching("diffusicraft-build.properties") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("THIRD_PARTY_NOTICES.md")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
