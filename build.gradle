plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Modrinth maven: used for optional compat targets and the dev-runtime modpack (see docs/DEVELOPMENT.md).
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	mavenCentral()
}

sourceSets {
	// Declarations of the part of Voxy's API that Diffusicraft calls: compile-time only, never run or shipped.
	voxyStubs {
		compileClasspath += sourceSets.main.compileClasspath
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/diffusicraft.classtweaker")

	mods {
		"diffusicraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			ideConfigGenerated true
			// The game itself, with the dev modpack, gets more than the servers and tests.
			vmArgs it.name == 'client' ? '-Xmx24G' : '-Xmx6G'
		}
		client {
			// Keep model downloads and worlds out of the source tree.
			runDir 'run'
		}
		server {
			runDir 'run-server'
		}
		// The dedicated server that DistantHorizonsServerGameTest joins, in a JVM of its own (see below).
		gameTestServer {
			server()
			runDir 'build/run/gameTestServer'
			programArg 'nogui'
			ideConfigGenerated false
		}
	}
}

// Client game tests (src/gametest): drive the real game through the Diffusicraft screens and save screenshots to
// build/run/clientGameTest/screenshots. Run with `./gradlew runClientGameTest -PnoDevMods` (see docs/DEVELOPMENT.md).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'diffusicraft-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Forward -Pdiffusicraft.* to the game tests too: the world generation test reads diffusicraft.device.
def gameTestServerDir = file('build/run/gameTestServer')
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	systemProperties project.properties.findAll { k, v -> k.startsWith('diffusicraft.') }
	systemProperty 'diffusicraft.testServerDir', gameTestServerDir.absolutePath
	// -Pdiffusicraft.graphicsBackend=vulkan or opengl: the game tests reset the options, whose default tries OpenGL
	// first, so only the launch argument picks the backend.
	def graphicsBackend = project.findProperty('diffusicraft.graphicsBackend')
	if (graphicsBackend) {
		args '--graphicsBackend', graphicsBackend
	}
	// -Pdiffusicraft.shaderPack=<file in shaderpacks>: Iris starts with that pack on, for every game test. The run's
	// directory, Iris's config in it, is new for each run.
	def shaderPack = project.findProperty('diffusicraft.shaderPack')
	if (shaderPack) {
		doFirst {
			def config = file('build/run/clientGameTest/config')
			config.mkdirs()
			new File(config, 'iris.properties').text = "enableShaders=true\nshaderPack=${shaderPack}\n"
		}
	}
}

// `./gradlew runGameTestServer -Pdiffusicraft.testServerPort=25570`: a dedicated server for the game tests that need
// one outside the client's JVM. Each start makes a new world on the test seed, offline so that the test's player can
// join, who is an operator to run the test's commands and stops the server when done. -Pdiffusicraft.device and
// -Pdiffusicraft.gpuMemoryLimitMb go into its Diffusicraft config. See docs/DEVELOPMENT.md.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
	def port = project.findProperty('diffusicraft.testServerPort') ?: '25570'
	def seed = project.findProperty('diffusicraft.seed') ?: '20261052'
	def device = project.findProperty('diffusicraft.device') ?: 'AUTO'
	def gpuMemoryLimitMb = project.findProperty('diffusicraft.gpuMemoryLimitMb') ?: '0'
	doFirst {
		delete new File(gameTestServerDir, 'world')
		new File(gameTestServerDir, 'config').mkdirs()
		// The same opt-in as the client game tests' servers (configureTests above).
		new File(gameTestServerDir, 'eula.txt').text = 'eula=true\n'
		new File(gameTestServerDir, 'server.properties').text = """\
			server-port=${port}
			online-mode=false
			enforce-secure-profile=false
			level-seed=${seed}
			view-distance=8
			simulation-distance=4
			spawn-protection=0
			motd=Diffusicraft game test server
			""".stripIndent()
		// The client game tests play as Player0; offline, a player's UUID comes from the name.
		def uuid = UUID.nameUUIDFromBytes('OfflinePlayer:Player0'.getBytes('UTF-8'))
		new File(gameTestServerDir, 'ops.json').text =
			"""[{"uuid": "${uuid}", "name": "Player0", "level": 4, "bypassesPlayerLimit": false}]\n"""
		new File(gameTestServerDir, 'config/diffusicraft.json').text =
			"""{"device": "${device}", "gpuMemoryLimitMb": ${gpuMemoryLimitMb}}\n"""
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Terrain Diffusion runs through ONNX Runtime. The CPU build is bundled as a jar-in-jar; GPU builds are
	// downloaded at runtime by the resource manager (see docs/RUNTIMES.md and runtime-manifest.json).
	implementation "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
	include "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Optional integration: the config screen button in Mod Menu. Compile-only; Mod Menu is not required.
	clientCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	// Optional integration: Distant Horizons LODs drawn from the terrain (compat.dh). Compile-only; never bundled.
	compileOnly "maven.modrinth:distanthorizons:${project.distanthorizons_version}"
	// Optional integration: Voxy (client.compat.voxy, client.mixin.voxy). Voxy is All Rights Reserved, so Diffusicraft
	// compiles against its own declarations of the few Voxy members it calls (src/voxyStubs), never against Voxy.
	clientCompileOnly sourceSets.voxyStubs.output
	// The shader game test turns Iris's shader packs on through Iris itself. Compile-only; Iris runs only as a dev mod.
	gametestCompileOnly "maven.modrinth:iris:${project.iris_version}"

	// Dev-runtime mods (client run only). See gradle/dev-mods.gradle.
}

apply from: 'gradle/dev-mods.gradle'

test {
	useJUnitPlatform()
	maxHeapSize = '4G'
	// Tests that need the real ONNX models are tagged "models" and skipped unless -PwithModels is set.
	if (!project.hasProperty('withModels')) {
		useJUnitPlatform { excludeTags 'models' }
	}
	// Forward -Pdiffusicraft.* and -Ponnxruntime.* (e.g. diffusicraft.modelDir, diffusicraft.device) to the tests.
	systemProperties project.properties.findAll { k, v -> k.startsWith('diffusicraft.') || k.startsWith('onnxruntime.') }
	testLogging.showStandardStreams = project.hasProperty('withModels')
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

processResources {
	def props = [
		version          : project.version,
		minecraft_version: project.minecraft_version,
		loader_version   : project.loader_version,
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
	filesMatching("diffusicraft-build.properties") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("THIRD_PARTY_NOTICES.md")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
